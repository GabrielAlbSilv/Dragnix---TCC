<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="icon"
        href="css/images/dranix_icon_white_nobackground.png"
        type="image/png"
    >

    <title>Dragnix — Painel ADM</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/admin-backup.css"
    >
    <style>
        /* Logo clicável */
        .logo-home {
            background: none;
            border: 0;
            padding: 0;
            margin: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            color: inherit;
            text-decoration: none;
            border-radius: 8px;
        }

        .logo-home img {
            transition: transform .15s ease;
        }

        .logo-home:hover img {
            transform: scale(1.08);
        }

        .logo-home:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 3px;
        }
    </style>

</head>

<body>

    <!-- ====================================================== -->
    <!-- CABEÇALHO / BARRA DO ADM -->
    <!-- ====================================================== -->
<header class="admin-header">

    <div class="admin-header-inner">

        <!-- Logo / título -->
        <div class="admin-brand">

            <a
                href="admin.html"
                class="logo-home"
                title="Ir para a página principal do painel"
                aria-label="Ir para a página principal do painel"
            >

                <img
                    src="css/images/dranix_icon_white_nobackground.png"
                    alt="Dragão"
                    class="trilhas-icon"
                >

            </a>

            <strong class="trilhas-title">
                Dragnix — Painel ADM
            </strong>

        </div>


        <!-- Menu (botão de três tracinhos) -->
        <div class="admin-menu" id="adminMenu">

            <button
                type="button"
                class="admin-menu-toggle"
                id="adminMenuToggle"
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="adminMenuPanel"
            >
                <i data-lucide="menu" id="adminMenuIcon"></i>
            </button>

            <nav
                class="admin-menu-panel"
                id="adminMenuPanel"
                aria-label="Menu do painel"
            >

                <button
                    type="button"
                    class="admin-menu-item"
                    id="t1"
                >
                    <i data-lucide="route"></i> Trilhas
                </button>

                <button
                    type="button"
                    class="admin-menu-item"
                    id="t2"
                >
                    <i data-lucide="users"></i> Usuários
                </button>

                <a
                    href="app.html"
                    class="admin-menu-item"
                >
                    <i data-lucide="graduation-cap"></i> Ver como aluno
                </a>

                <button
                    type="button"
                    class="admin-menu-item adm-only"
                    onclick="window.location.href='admin-sistema.html'"
                >
                    <i data-lucide="settings"></i> Sistema / Banco
                </button>

                <div class="admin-menu-divider"></div>

                <button
                    type="button"
                    class="admin-menu-item admin-menu-danger"
                    onclick="logout()"
                >
                    <i data-lucide="log-out"></i> Sair
                </button>

            </nav>

        </div>

    </div>

</header>
    <!-- ====================================================== -->
    <!-- CONTEÚDO PRINCIPAL -->
    <!-- ====================================================== -->

    <div
        class="wrap wide"
        id="main"
    ></div>

    <!-- ====================================================== -->
    <!-- MODAL -->
    <!-- ====================================================== -->

    <dialog id="dlg">

        <form id="frm">

            <h3 id="dt"></h3>

            <div id="fields"></div>

            <div
                class="err"
                id="derr"
            ></div>

            <div class="row">

                <button
                    type="button"
                    class="btn sec"
                    id="cx"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn"
                    id="ok"
                >
                    Salvar
                </button>

            </div>

        </form>

    </dialog>

    <!-- ====================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ====================================================== -->

    <script src="js/icons.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/theme.js"></script>

    <script>
        /* Menu do painel (três tracinhos) */
        (function () {

            const menu = document.getElementById('adminMenu');
            const toggle = document.getElementById('adminMenuToggle');
            const toggleIcon = document.getElementById('adminMenuIcon');

            function setOpen(open) {
                menu.classList.toggle('open', open);
                toggle.setAttribute('aria-expanded', String(open));
                toggle.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
                toggleIcon.setAttribute('data-lucide', open ? 'x' : 'menu');
            }

            toggle.addEventListener('click', function () {
                setOpen(!menu.classList.contains('open'));
            });

            // Clicar em qualquer opção fecha o menu
            menu.querySelectorAll('.admin-menu-item').forEach(function (item) {
                item.addEventListener('click', function () {
                    setOpen(false);
                });
            });

            // Clicar fora fecha
            document.addEventListener('click', function (event) {
                if (!menu.contains(event.target)) {
                    setOpen(false);
                }
            });

            // Esc fecha
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && menu.classList.contains('open')) {
                    setOpen(false);
                    toggle.focus();
                }
            });

        })();
    </script>

</body>

</html>
