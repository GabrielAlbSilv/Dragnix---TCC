
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#202329"
    >

    <title>Dragnix — Painel Administrativo</title>

    <link
        rel="icon"
        href="css/images/dranix_icon_white_nobackground.png"
        type="image/png"
    >
        <!-- Estilo geral da Dragnix -->
        <link rel="stylesheet" href="css/style.css">

        <!-- Estilos administrativos originais -->
        <link rel="stylesheet" href="css/admin-backup.css">

        <!-- Estilos modernos do painel -->
        <link rel="stylesheet" href="css/admin-modern.css">
</head>

<body class="admin-page">

    <!-- ============================================
         CABEÇALHO ADMINISTRATIVO
         ============================================ -->

    <header class="admin-header">

        <div class="admin-header-inner">

            <!-- MARCA -->
            <div class="admin-brand">

                <a
                    href="app.html"
                    class="logo-home"
                    title="Ir para o painel do aluno"
                    aria-label="Ir para o painel do aluno"
                >

                    <img
                        src="css/images/dragnix_dragon_black_nobackground.png"
                        data-logo-light="css/images/dragnix_dragon_black_nobackground.png"
                        data-logo-dark="css/images/dranix_icon_white_nobackground.png"
                        alt="Dragão Dragnix"
                        class="trilhas-icon"
                        width="40"
                        height="40"
                    >

                </a>

                <div class="admin-brand-text">

                    <strong class="trilhas-title">
                        Dragnix — Painel ADM
                    </strong>

                    <span class="admin-brand-subtitle">
                        Gerenciamento da plataforma
                    </span>

                </div>

            </div>

            <!-- MENU ADMINISTRATIVO -->
            <div
                class="admin-menu"
                id="adminMenu"
            >

                <button
                    type="button"
                    class="admin-menu-toggle"
                    id="adminMenuToggle"
                    aria-label="Abrir menu"
                    aria-expanded="false"
                    aria-controls="adminMenuPanel"
                    title="Menu de navegação"
                >
                    <i
                        data-lucide="menu"
                        id="adminMenuIcon"
                    ></i>
                </button>

                <nav
                    class="admin-menu-panel"
                    id="adminMenuPanel"
                    aria-label="Navegação administrativa"
                >

                    <!-- GESTÃO -->
                    <button
                        type="button"
                        class="admin-menu-item"
                        id="t1"
                    >
                        <i data-lucide="route"></i>
                        <span>Trilhas</span>
                    </button>

                    <button
                        type="button"
                        class="admin-menu-item"
                        id="t2"
                    >
                        <i data-lucide="users"></i>
                        <span>Usuários</span>
                    </button>

                    <div class="admin-menu-divider"></div>

                    <!-- NAVEGAÇÃO -->
                    <a
                        href="app.html"
                        class="admin-menu-item"
                    >
                        <i data-lucide="graduation-cap"></i>
                        <span>Ver como aluno</span>
                    </a>

                    <button
                        type="button"
                        class="admin-menu-item adm-only"
                        onclick="window.location.href='admin-sistema.html'"
                    >
                        <i data-lucide="settings"></i>
                        <span>Sistema / Banco</span>
                    </button>

                    <div class="admin-menu-divider"></div>

                    <!-- SAIR -->
                    <button
                        type="button"
                        class="admin-menu-item admin-menu-danger"
                        onclick="logout()"
                    >
                        <i data-lucide="log-out"></i>
                        <span>Sair da conta</span>
                    </button>

                </nav>

            </div>

        </div>

    </header>

    <!-- ============================================
         CONTEÚDO PRINCIPAL
         ============================================ -->

    <main
        class="wrap wide admin-main"
        id="main"
        aria-label="Conteúdo do painel administrativo"
    ></main>

    <!-- ============================================
         MODAL DE EDIÇÃO
         ============================================ -->

    <dialog
        id="dlg"
        aria-labelledby="dt"
    >

        <form id="frm">

            <h3 id="dt"></h3>

            <div id="fields"></div>

            <div
                class="err"
                id="derr"
                role="alert"
            ></div>

            <div class="row">

                <button
                    type="button"
                    class="btn sec"
                    id="cx"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn"
                    id="ok"
                >
                    Salvar
                </button>

            </div>

        </form>

    </dialog>

    <!-- ============================================
         JAVASCRIPT
         ============================================ -->

    <script src="js/icons.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/theme.js"></script>

</body>
</html>
