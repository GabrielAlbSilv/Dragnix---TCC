<!doctype html><html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragnix — Entrar</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="css/images/dranix_icon_white_nobackground.png"image/png">

</head>
<body>
<div class="wrap">
  <h1 style="color:var(--g)">
    <img src="css/images/dranix_icon_white_nobackground.png" alt="Logo" width="50">
    Dragnix </h1>
<div class="tabs"><button class="btn" id="tl">Entrar</button><button class="btn sec" id="tr">Criar conta</button></div>
<div class="card"><input id="name" class="hide" placeholder="Nome"><input id="email" type="email" placeholder="E-mail">
<input id="pass" type="password" placeholder="Senha (mín. 6 caracteres)"><div class="err" id="err"></div>
<button class="btn" id="go" style="width:100%">Entrar</button></div></div>
<script src="js/api.js"></script><script>
if (localStorage.token) location = '/app.html';
let mode = 'login'; const $ = id => document.getElementById(id);
function set(m) { mode = m; $('name').classList.toggle('hide', m === 'login'); $('go').textContent = m === 'login' ? 'Entrar' : 'Criar conta';
  $('tl').className = 'btn' + (m === 'login' ? '' : ' sec'); $('tr').className = 'btn' + (m === 'login' ? ' sec' : ''); $('err').textContent = ''; }
$('tl').onclick = () => set('login'); $('tr').onclick = () => set('register');
$('go').onclick = async () => {
  try {
    const d = await api('/auth/' + mode, 'POST', { name: $('name').value, email: $('email').value, password: $('pass').value });
    localStorage.token = d.token; localStorage.user = JSON.stringify(d.user); location = '/app.html';
  } catch (e) { $('err').textContent = e.message; }
};
</script></body></html>
