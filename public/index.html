
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>Dragnix — Entrar</title>

    <link
        rel="icon"
        href="css/images/dranix_icon_white_nobackground.png"
        type="image/png"
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login-modern.css">

</head>

<body class="login-page dragnix-login">

    <!-- BOTÃO DE TEMA -->
    <button
        type="button"
        id="indexThemeToggle"
        class="index-theme-toggle"
        aria-label="Alternar tema"
        title="Alternar tema"
    >
        <i data-lucide="moon"></i>
    </button>

    <!-- ESTRUTURA PRINCIPAL -->
    <main class="login-layout">

        <!-- LADO ESQUERDO: DRAGÃO -->
        <section
            class="login-visual"
            aria-label="Identidade visual Dragnix"
        >

            <div class="login-visual-inner">

                <div class="login-dragon-container">

                    <img
                        src="css/images/dragnix_dragon_black_nobackground.png"
                        data-logo-light="css/images/dragnix_dragon_black_nobackground.png"
                        data-logo-dark="css/images/dranix_icon_white_nobackground.png"
                        alt="Dragão Dragnix"
                        class="login-dragon"
                    >

                </div>

                <div class="login-visual-caption">
                    <span class="login-visual-line"></span>
                    <span>Aprenda. Evolua. Conquiste.</span>
                </div>

            </div>

        </section>

        <!-- LADO DIREITO: AUTENTICAÇÃO -->
        <section class="login-content">

            <div class="login-content-inner">

                <!-- LOGO COM O NOME -->
                <header class="login-brand">

                    <img
                        src="css/images/dranix_name_black_nobackground.png"
                        data-logo-light="css/images/dranix_name_black_nobackground.png"
                        data-logo-dark="css/images/dranix_name_white_nobackground.png"
                        alt="Dragnix"
                        class="login-name-logo"
                    >

                    <p class="login-brand-description">
                        Sua jornada de aprendizado começa aqui.
                    </p>

                </header>

                <!-- ÁREA DO FORMULÁRIO -->
                <div class="login-form-area">

                    <div class="login-form-heading">
                        <h1>Bem-vindo à Dragnix</h1>
                        <p>Entre na sua conta ou comece sua jornada.</p>
                    </div>

                    <!-- ABAS -->
                    <div
                        class="tabs login-tabs"
                        aria-label="Escolha a forma de acesso"
                    >

                        <button
                            type="button"
                            class="btn"
                            id="tl"
                        >
                            Entrar
                        </button>

                        <button
                            type="button"
                            class="btn sec"
                            id="tr"
                        >
                            Criar conta
                        </button>

                    </div>

                    <!-- FORMULÁRIO ORIGINAL -->
                    <div class="card login-card">

                        <!-- NOME -->
                        <input
                            id="name"
                            class="hide"
                            type="text"
                            placeholder="Nome"
                            autocomplete="name"
                            aria-label="Nome"
                        >

                        <!-- E-MAIL -->
                        <input
                            id="email"
                            type="email"
                            placeholder="E-mail"
                            autocomplete="email"
                            aria-label="E-mail"
                        >

                        <!-- SENHA -->
                        <div class="senha-box">

                            <input
                                id="pass"
                                type="password"
                                placeholder="Senha (mín. 6 caracteres)"
                                autocomplete="current-password"
                                aria-label="Senha"
                            >

                            <button
                                type="button"
                                class="senha-btn"
                                onclick="mostrarSenha('pass', this)"
                                aria-label="Mostrar senha"
                            >
                                <i data-lucide="eye"></i>
                            </button>

                        </div>

                        <!-- CONFIRMAR SENHA -->
                        <div
                            class="senha-box hide"
                            id="passConfirmBox"
                        >

                            <input
                                id="passConfirm"
                                type="password"
                                placeholder="Confirmar senha"
                                autocomplete="new-password"
                                aria-label="Confirmar senha"
                            >

                            <button
                                type="button"
                                class="senha-btn"
                                onclick="mostrarSenha('passConfirm', this)"
                                aria-label="Mostrar senha"
                            >
                                <i data-lucide="eye"></i>
                            </button>

                        </div>

                        <!-- ERROS -->
                        <div
                            class="err"
                            id="err"
                            role="alert"
                            aria-live="polite"
                        ></div>

                        <!-- ENTRAR / CADASTRAR -->
                        <button
                            class="btn"
                            id="go"
                            type="button"
                        >
                            Entrar
                        </button>

                    </div>

                </div>

                <!-- LINKS INFERIORES -->
                <footer class="site-footer login-footer">

                    <div class="site-footer-inner">

                        <button
                            type="button"
                            class="footer-link"
                        >
                            <i data-lucide="info"></i>
                            Sobre
                        </button>

                        <span
                            class="footer-separator"
                            aria-hidden="true"
                        >•</span>

                        <button
                            type="button"
                            class="footer-link"
                        >
                            <i data-lucide="users"></i>
                            Equipe
                        </button>

                        <span
                            class="footer-separator"
                            aria-hidden="true"
                        >•</span>

                        <button
                            type="button"
                            class="footer-link"
                        >
                            <i data-lucide="message-square"></i>
                            Feedback / Contato
                        </button>

                    </div>

                </footer>

            </div>

        </section>

    </main>

    <!-- SCRIPTS ORIGINAIS -->
    <script src="js/icons.js"></script>
    <script src="js/api.js"></script>
    <script src="js/loginsplash.js"></script>
    <script src="js/theme.js"></script>

</body>
</html>
