<!doctype html>

<html lang="pt-BR">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="icon"
        href="css/images/dranix_icon_white_nobackground.png"
        type="image/png"
    >

    <title>Dragnix — Minhas trilhas</title>

    <!-- CSS global -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- CSS exclusivo desta página -->
    <link
        rel="stylesheet"
        href="css/app.css"
    >

    <style>
        /* Logo clicável */
        .logo-home {
            background: none;
            border: 0;
            padding: 0;
            margin: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            color: inherit;
            text-decoration: none;
            border-radius: 8px;
        }

        .logo-home img {
            transition: transform .15s ease;
        }

        .logo-home:hover img {
            transform: scale(1.08);
        }

        .logo-home:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 3px;
        }
    </style>

</head>

<body>

    <header>

        <strong class="trilhas-title">

            <button
                type="button"
                class="logo-home"
                onclick="home()"
                title="Ir para a página principal"
                aria-label="Ir para a página principal"
            >

                <img
                    src="css/images/dranix_icon_white_nobackground.png"
                    alt="Dragão"
                    class="trilhas-icon"
                >

            </button>

            Minhas trilhas

        </strong>

        <span class="stats">

            <span id="lvl"></span>

            <span id="coins"></span>

            <span id="streak">0</span>

            <span id="hearts">5</span>

            <span id="xp">0</span>

        </span>

    </header>


    <!-- ============================================================
         NAVEGAÇÃO PRINCIPAL
         ============================================================ -->

    <nav
        class="app-navigation"
        aria-label="Navegação principal"
    >

        <!-- ========================================================
             NAVEGAÇÃO PRINCIPAL
             ======================================================== -->

        <div class="app-navigation-main">

            <button
                class="app-nav-button active"
                type="button"
                onclick="home()"
            >

                <span class="app-nav-icon"><i data-lucide="map"></i></span>

                <span class="app-nav-content">

                    <strong>Trilhas</strong>

                    <small>
                        Continue seus estudos e aprenda novos conteúdos.
                    </small>

                </span>

            </button>


            <button
                class="app-nav-button"
                type="button"
                onclick="badges()"
            >

                <span class="app-nav-icon"><i data-lucide="award"></i></span>

                <span class="app-nav-content">

                    <strong>Conquistas</strong>

                    <small>
                        Veja suas conquistas e tudo que já desbloqueou.
                    </small>

                </span>

            </button>


            <button
                class="app-nav-button"
                type="button"
                onclick="profile()"
            >

                <span class="app-nav-icon"><i data-lucide="user-round"></i></span>

                <span class="app-nav-content">

                    <strong>Perfil</strong>

                    <small>
                        Consulte suas informações e seu progresso.
                    </small>

                </span>

            </button>


            <button
                class="app-nav-button"
                type="button"
                onclick="rank()"
            >

                <span class="app-nav-icon"><i data-lucide="trophy"></i></span>

                <span class="app-nav-content">

                    <strong>Ranking</strong>

                    <small>
                        Compare seu desempenho com outros usuários.
                    </small>

                </span>

            </button>


            <button
                class="app-nav-button"
                type="button"
                onclick="doubts()"
            >

                <span class="app-nav-icon"><i data-lucide="message-square"></i></span>

                <span class="app-nav-content">

                    <strong>Dúvidas</strong>

                    <small>
                        Tire suas dúvidas com os professores.
                    </small>

                </span>

            </button>


            <button
                class="app-nav-button"
                type="button"
                onclick="gestao()"
            >

                <span class="app-nav-icon"><i data-lucide="briefcase"></i></span>

                <span class="app-nav-content">

                    <strong>Gestão financeira</strong>

                    <small>
                        Aprenda a organizar e cuidar melhor do seu dinheiro.
                    </small>

                </span>

            </button>

        </div>


        <!-- ========================================================
             CONTA / ADMINISTRAÇÃO
             ======================================================== -->

        <div class="app-navigation-account">

            <a
                id="adm"
                class="app-nav-button app-nav-admin hide"
                href="admin.html"
            >

                <span class="app-nav-icon"><i data-lucide="shield"></i></span>

                <span class="app-nav-content">

                    <strong>Painel ADM</strong>

                    <small>
                        Gerencie os recursos da plataforma.
                    </small>

                </span>

            </a>


            <button
                class="app-nav-button app-theme-button"
                type="button"
                data-theme-toggle
                onclick="toggleTheme()"
            >

                <span class="app-nav-icon theme-button-icon"><i data-lucide="moon"></i></span>

                <span class="app-nav-content">

                    <strong class="theme-button-text">
                        Modo escuro
                    </strong>

                    <small>
                        Alterar aparência do Dragnix.
                    </small>

                </span>

            </button>


            <button
                class="app-nav-button app-nav-logout"
                type="button"
                onclick="logout()"
            >

                <span class="app-nav-icon"><i data-lucide="log-out"></i></span>

                <span class="app-nav-content">

                    <strong>Sair</strong>

                    <small>
                        Encerrar sua sessão.
                    </small>

                </span>

            </button>

        </div>

    </nav>


    <main
        class="wrap"
        id="main"
    ></main>


    <script src="js/api.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
