
<!doctype html>

<html lang="pt-BR">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="icon"
        href="css/images/dranix_icon_white_nobackground.png"
        type="image/png"
    >

    <title>Dragnix — Minhas trilhas</title>

    <!-- CSS global -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- CSS exclusivo desta página -->
    <link
        rel="stylesheet"
        href="css/app.css"
    >

</head>

<body>

    <header>

        <strong class="trilhas-title">

            <img
                src="css/images/dranix_icon_white_nobackground.png"
                alt="Dragão"
                class="trilhas-icon"
            >

            Minhas trilhas

        </strong>

        <span class="stats">

            <span id="lvl"></span>

            <span id="coins"></span>

            <span id="streak">0</span>

            <span id="hearts">5</span>

            <span id="xp">0</span>

        </span>

    </header>


    <!-- ============================================================
         NAVEGAÇÃO PRINCIPAL
         ============================================================ -->

    <nav
        class="app-navigation"
        aria-label="Navegação principal"
    >

        <!-- ========================================================
             NAVEGAÇÃO PRINCIPAL
             ======================================================== -->

        <div class="app-navigation-main">

            <button
                class="app-nav-button active"
                type="button"
                onclick="home()"
            >

                <span class="app-nav-icon">🗺️</span>

                <span class="app-nav-content">

                    <strong>Trilhas</strong>

                    <small>
                        Continue seus estudos e aprenda novos conteúdos.
                    </small>

                </span>

            </button>


            <button
                class="app-nav-button"
                type="button"
                onclick="badges()"
            >

                <span class="app-nav-icon">🏅</span>

                <span class="app-nav-content">

                    <strong>Conquistas</strong>

                    <small>
                        Veja suas conquistas e tudo que já desbloqueou.
                    </small>

                </span>

            </button>


            <button
                class="app-nav-button"
                type="button"
                onclick="profile()"
            >

                <span class="app-nav-icon">👤</span>

                <span class="app-nav-content">

                    <strong>Perfil</strong>

                    <small>
                        Consulte suas informações e seu progresso.
                    </small>

                </span>

            </button>


            <button
                class="app-nav-button"
                type="button"
                onclick="rank()"
            >

                <span class="app-nav-icon">🏆</span>

                <span class="app-nav-content">

                    <strong>Ranking</strong>

                    <small>
                        Compare seu desempenho com outros usuários.
                    </small>

                </span>

            </button>


            <button
                class="app-nav-button"
                type="button"
                onclick="gestao()"
            >

                <span class="app-nav-icon">💼</span>

                <span class="app-nav-content">

                    <strong>Gestão financeira</strong>

                    <small>
                        Aprenda a organizar e cuidar melhor do seu dinheiro.
                    </small>

                </span>

            </button>

        </div>


        <!-- ========================================================
             CONTA / ADMINISTRAÇÃO
             ======================================================== -->

        <div class="app-navigation-account">

            <a
                id="adm"
                class="app-nav-button app-nav-admin hide"
                href="admin.html"
            >

                <span class="app-nav-icon">🛡️</span>

                <span class="app-nav-content">

                    <strong>Painel ADM</strong>

                    <small>
                        Gerencie os recursos da plataforma.
                    </small>

                </span>

            </a>


            <button
                class="app-nav-button app-theme-button"
                type="button"
                data-theme-toggle
                onclick="toggleTheme()"
            >

                <span class="app-nav-icon theme-button-icon">🌙</span>

                <span class="app-nav-content">

                    <strong class="theme-button-text">
                        Modo escuro
                    </strong>

                    <small>
                        Alterar aparência do Dragnix.
                    </small>

                </span>

            </button>


            <button
                class="app-nav-button app-nav-logout"
                type="button"
                onclick="logout()"
            >

                <span class="app-nav-icon">🚪</span>

                <span class="app-nav-content">

                    <strong>Sair</strong>

                    <small>
                        Encerrar sua sessão.
                    </small>

                </span>

            </button>

        </div>

    </nav>


    <main
        class="wrap"
        id="main"
    ></main>


    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
