<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link
    rel="icon"
    href="css/images/dranix_icon_white_nobackground.png"
    type="image/png"
  >

  <title>Dragnix — Sistema</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/admin-backup.css"
  >

  <link
    rel="stylesheet"
    href="css/admin-sistema.css"
  >

    <style>
        /* Logo clicável */
        .logo-home {
            background: none;
            border: 0;
            padding: 0;
            margin: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            color: inherit;
            text-decoration: none;
            border-radius: 8px;
        }

        .logo-home img {
            transition: transform .15s ease;
        }

        .logo-home:hover img {
            transform: scale(1.08);
        }

        .logo-home:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 3px;
        }
    </style>

</head>

<body>

  <header class="admin-system-header">

    <div class="admin-system-top">

      <div class="admin-brand">

        <a
          href="admin.html"
          class="logo-home"
          title="Ir para a página principal do painel"
          aria-label="Ir para a página principal do painel"
        >

          <img
            src="css/images/dranix_icon_white_nobackground.png"
            alt="Dragnix"
          >

        </a>

        <strong>
          Dragnix — Sistema
        </strong>

      </div>

      <div class="admin-system-actions">

        <button
          type="button"
          class="admin-action-btn"
          id="btnVoltarAdmin"
        >
          <i data-lucide="arrow-left"></i> Painel ADM
        </button>

        <button
          type="button"
          class="admin-action-btn"
          id="btnSairSistema"
        >
          Sair
        </button>

      </div>

    </div>

  </header>


  <main class="admin-system-container">

    <!-- ================================================== -->
    <!-- VISÃO GERAL -->
    <!-- ================================================== -->

    <section class="system-section">

      <div class="system-section-header">

        <div>

          <h1>
            Visão geral
          </h1>

          <p>
            Informações atuais do sistema e do banco de dados.
          </p>

        </div>

        <button
          type="button"
          class="system-refresh-btn"
          id="btnAtualizarSistema"
        >
          <i data-lucide="refresh-cw"></i> Atualizar
        </button>

      </div>


      <div
        id="systemStatus"
        class="system-status"
      >
        Carregando informações...
      </div>


      <div
        id="systemCards"
        class="system-cards"
      >
      </div>

    </section>


    <!-- ================================================== -->
    <!-- BANCO -->
    <!-- ================================================== -->

    <section class="system-section">

      <div class="system-section-header">

        <div>

          <h2>
            Banco de dados
          </h2>

          <p>
            Todas as tabelas disponíveis no banco do Dragnix.
          </p>

        </div>

      </div>


      <div
        id="databaseTables"
        class="database-tables"
      >
      </div>


      <div
        id="tableViewer"
        class="table-viewer"
      >

        <div class="table-viewer-empty">

          <span>
            <i data-lucide="database"></i>
          </span>

          <p>
            Selecione uma tabela para visualizar os dados.
          </p>

        </div>

      </div>

    </section>


    <!-- ================================================== -->
    <!-- BACKUP -->
    <!-- ================================================== -->

    <section class="system-section backup-system-section">

      <div class="system-section-header">

        <div>

          <h2>
            Backup e manutenção
          </h2>

          <p>
            Operações administrativas do banco de dados.
          </p>

        </div>

      </div>


      <div class="system-backup-buttons">

        <button
          type="button"
          class="admin-action-btn"
          id="btnGerarBackup"
        >
          <i data-lucide="download"></i> Gerar backup
        </button>


        <button
          type="button"
          class="admin-action-btn"
          id="btnSelecionarBackup"
        >
          <i data-lucide="send"></i> Ler backup
        </button>


        <input
          type="file"
          id="backupFileInput"
          accept=".dragnix"
          hidden
        >


        <button
          type="button"
          class="admin-action-btn"
          id="btnRestaurarBackup"
          disabled
        >
          <i data-lucide="archive-restore"></i> Restaurar backup
        </button>


        <button
          type="button"
          class="admin-action-btn admin-danger-btn"
          id="btnLimparBanco"
        >
          <i data-lucide="trash-2"></i> Limpar banco
        </button>

      </div>


      <div
        id="backupStatus"
        class="backup-status"
        aria-live="polite"
      >
      </div>


      <div
        id="backupPreview"
        class="backup-preview"
      >
      </div>

    </section>

  </main>


  <script src="js/icons.js"></script>
  <script src="js/admin-sistema.js"></script>
  <script src="js/admin-backup.js" ></script>
  <script src="js/theme.js"></script>
</body>

</html>
